# Deploy on Render: New + > Blueprint > pick this repo.
# Free plan: Practice mode on live prices. The free plan has no persistent disk, so paper balances
# reset when the service restarts, and it sleeps after ~15 min idle (first load then takes ~1 min).
# For real money: switch to plan: starter, add a disk at /var/data and set DB_PATH=/var/data/flip.db.
services:
  - type: web
    name: flip
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: ./data/flip.db
      - key: STATIC_DIR
        value: ../web/dist
      - key: REAL_ENABLED
        value: "false"
      - key: BRAND_NAME
        value: flip
      - key: TOKEN_TICKER
        value: FLIP
      # Public RPC works for Practice mode but is rate limited. Swap in a Helius URL in the
      # Render dashboard (Environment tab) for reliability.
      - key: RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: VITE_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: SLOW_POLL_MS
        value: "30000"
      - key: ADMIN_KEY
        generateValue: true
